name: Auto-assign reviewers by page owners

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  changed-pages:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
      files: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            docs/*.md
            docs/**/*.md
            docs/**/*.rst

  validate-owners:
    needs: changed-pages
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate owner directives
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const files = process.env.CHANGED_FILES
              .split(' ')
              .filter(Boolean);

            const validEntry =
              /^(team:)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i;

            function extractMd(content) {
              const match = content.match(
                /```\{owners\}\s*(.+?)\s*```/s
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : null;
            }

            function extractRst(content) {
              const match = content.match(
                /^\.\.\s+owners::\s*(.+)$/m
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : null;
            }

            const errors = [];
            const missingOwners = [];
            let checkedPages = 0;
            let pagesWithValidOwners = 0;

            for (const file of files) {
              if (!fs.existsSync(file)) {
                console.log(`${file}: deleted file, skipping`);
                continue;
              }

              const extension = path.extname(file).toLowerCase();

              if (
                extension !== '.md' &&
                extension !== '.markdown' &&
                extension !== '.rst'
              ) {
                continue;
              }

              checkedPages++;

              const content = fs.readFileSync(file, 'utf8');
              const owners = extension === '.rst'
                ? extractRst(content)
                : extractMd(content);

              if (owners === null) {
                missingOwners.push(file);
                continue;
              }

              const invalidEntries = owners.filter(
                entry => !entry || !validEntry.test(entry)
              );

              if (invalidEntries.length > 0) {
                for (const entry of invalidEntries) {
                  errors.push(
                    `${file}: invalid owner entry "${entry}"`
                  );
                }
                continue;
              }

              pagesWithValidOwners++;
            }

            for (const file of missingOwners) {
              core.warning(`${file}: missing owners directive`);
            }

            if (errors.length > 0) {
              for (const error of errors) {
                core.error(error);
              }

              core.setFailed(
                `${errors.length} invalid owner entry or entries found.`
              );
              return;
            }

            if (checkedPages === 0) {
              console.log(
                'No existing changed documentation pages to validate.'
              );
              return;
            }

            if (pagesWithValidOwners === 0) {
              core.setFailed(
                'None of the changed pages declares valid owners.'
              );
              return;
            }

            console.log(
              `${pagesWithValidOwners} changed page(s) declare valid owners.`
            );
            console.log(
              `${missingOwners.length} changed page(s) have no owners directive.`
            );

  assign-reviewers:
    needs: [changed-pages, validate-owners]
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract owners and request review
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          github-token: ${{ secrets.CKT_BOT_PR }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const TEAM_ORG = 'canonical';

            const files = process.env.CHANGED_FILES
              .split(' ')
              .filter(Boolean);

            const users = new Set();
            const teams = new Set();

            function addOwner(entry) {
              const key = entry.trim();

              if (!key) {
                return;
              }

              if (key.toLowerCase().startsWith('team:')) {
                teams.add(key.slice(5).trim());
              } else {
                users.add(key.replace(/^@/, ''));
              }
            }

            function extractMd(content) {
              const match = content.match(
                /```\{owners\}\s*(.+?)\s*```/s
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : [];
            }

            function extractRst(content) {
              const match = content.match(
                /^\.\.\s+owners::\s*(.+)$/m
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : [];
            }

            for (const file of files) {
              if (!fs.existsSync(file)) {
                continue;
              }

              const extension = path.extname(file).toLowerCase();
              let owners = [];

              if (
                extension === '.md' ||
                extension === '.markdown'
              ) {
                owners = extractMd(
                  fs.readFileSync(file, 'utf8')
                );
              } else if (extension === '.rst') {
                owners = extractRst(
                  fs.readFileSync(file, 'utf8')
                );
              }

              owners.forEach(addOwner);
            }

            const author =
              context.payload.pull_request.user.login;

            users.delete(author);

            console.log('Org (teams):', TEAM_ORG);
            console.log(
              'Users:',
              [...users],
              'Teams:',
              [...teams]
            );

            if (users.size === 0 && teams.size === 0) {
              console.log('No owners found, skipping.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number:
                  context.payload.pull_request.number,
                reviewers: [...users],
                team_reviewers: [...teams],
              });
            } catch (error) {
              core.setFailed(
                `requestReviewers failed: ${error.message}`
              );
            }