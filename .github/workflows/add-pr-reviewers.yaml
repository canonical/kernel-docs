name: Auto-assign reviewers by page owners

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  changed-pages:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
      files: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            docs/*.md
            docs/**/*.md
            docs/**/*.rst

  validate-owners:
    needs: changed-pages
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate owner directives
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const files = process.env.CHANGED_FILES
              .split(' ')
              .filter(Boolean);

            const validEntry =
              /^(team:)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i;

            function extractMd(content) {
              const match = content.match(
                /```\{owners\}\s*(.+?)\s*```/s
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : null;
            }

            function extractRst(content) {
              const match = content.match(
                /^\.\.\s+owners::\s*(.+)$/m
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : null;
            }

            const errors = [];
            const missingOwners = [];
            let checkedPages = 0;
            let pagesWithValidOwners = 0;

            for (const file of files) {
              if (!fs.existsSync(file)) {
                console.log(`${file}: deleted file, skipping`);
                continue;
              }

              const extension = path.extname(file).toLowerCase();

              if (
                extension !== '.md' &&
                extension !== '.markdown' &&
                extension !== '.rst'
              ) {
                continue;
              }

              checkedPages++;

              const content = fs.readFileSync(file, 'utf8');
              const owners = extension === '.rst'
                ? extractRst(content)
                : extractMd(content);

              if (owners === null) {
                missingOwners.push(file);
                continue;
              }

              const invalidEntries = owners.filter(
                entry => !entry || !validEntry.test(entry)
              );

              if (invalidEntries.length > 0) {
                for (const entry of invalidEntries) {
                  errors.push(
                    `${file}: invalid owner entry "${entry}"`
                  );
                }
                continue;
              }

              pagesWithValidOwners++;
            }

            for (const file of missingOwners) {
              core.warning(`${file}: missing owners directive`);
            }

            if (errors.length > 0) {
              for (const error of errors) {
                core.error(error);
              }

              core.setFailed(
                `${errors.length} invalid owner entry or entries found.`
              );
              return;
            }

            if (checkedPages === 0) {
              console.log(
                'No existing changed documentation pages to validate.'
              );
              return;
            }

            if (pagesWithValidOwners === 0) {
              core.setFailed(
                'None of the changed pages declares valid owners.'
              );
              return;
            }

            console.log(
              `${pagesWithValidOwners} changed page(s) declare valid owners.`
            );
            console.log(
              `${missingOwners.length} changed page(s) have no owners directive.`
            );

  assign-reviewers:
    needs: [changed-pages, validate-owners]
    if: needs.changed-pages.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract owners and request review
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ needs.changed-pages.outputs.files }}
        with:
          # Needs org read access (read:org / Members + Teams read) so that
          # team and membership lookups work for private teams.
          github-token: ${{ secrets.CKT_BOT_PR }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const TEAM_ORG = 'canonical';
            const { owner, repo } = context.repo;

            const files = process.env.CHANGED_FILES
              .split(' ')
              .filter(Boolean);

            // name -> Set of files that declared this owner
            const users = new Map();
            const teams = new Map();

            function addOwner(entry, file) {
              const key = entry.trim();

              if (!key) {
                return;
              }

              const isTeam = key.toLowerCase().startsWith('team:');
              const name = isTeam
                ? key.slice(5).trim()
                : key.replace(/^@/, '');
              const map = isTeam ? teams : users;

              if (!map.has(name)) {
                map.set(name, new Set());
              }
              map.get(name).add(file);
            }

            function extractMd(content) {
              const match = content.match(
                /```\{owners\}\s*(.+?)\s*```/s
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : [];
            }

            function extractRst(content) {
              const match = content.match(
                /^\.\.\s+owners::\s*(.+)$/m
              );

              return match
                ? match[1].split(',').map(entry => entry.trim())
                : [];
            }

            for (const file of files) {
              if (!fs.existsSync(file)) {
                continue;
              }

              const extension = path.extname(file).toLowerCase();
              let owners = [];

              if (
                extension === '.md' ||
                extension === '.markdown'
              ) {
                owners = extractMd(
                  fs.readFileSync(file, 'utf8')
                );
              } else if (extension === '.rst') {
                owners = extractRst(
                  fs.readFileSync(file, 'utf8')
                );
              }

              owners.forEach(entry => addOwner(entry, file));
            }

            const author =
              context.payload.pull_request.user.login;

            users.delete(author);

            console.log('Org (teams):', TEAM_ORG);
            console.log(
              'Users:',
              [...users.keys()],
              'Teams:',
              [...teams.keys()]
            );

            if (users.size === 0 && teams.size === 0) {
              console.log('No owners found, skipping.');
              return;
            }

            // Returns null if the user can be requested, otherwise a
            // human-readable reason why not.
            async function checkUser(login) {
              // Does the account exist at all?
              try {
                await github.rest.users.getByUsername({
                  username: login,
                });
              } catch (e) {
                if (e.status === 404) {
                  return `user "${login}" does not exist on GitHub`;
                }
                throw e;
              }

              // Reviewers must be collaborators on the repo
              try {
                await github.rest.repos.checkCollaborator({
                  owner,
                  repo,
                  username: login,
                });
                return null;
              } catch (e) {
                if (e.status !== 404) {
                  throw e;
                }
              }

              // Not a collaborator: work out why
              try {
                await github.rest.orgs.checkMembershipForUser({
                  org: TEAM_ORG,
                  username: login,
                });
                return `user "${login}" is in the ${TEAM_ORG} org ` +
                  `but has no access to ${owner}/${repo}`;
              } catch (e) {
                if (e.status === 404) {
                  return `user "${login}" is not a member of the ` +
                    `${TEAM_ORG} org and is not a collaborator on ` +
                    `${owner}/${repo}`;
                }
                throw e;
              }
            }

            // Returns null if the team can be requested, otherwise a
            // human-readable reason why not.
            async function checkTeam(slug) {
              try {
                await github.rest.teams.getByName({
                  org: TEAM_ORG,
                  team_slug: slug,
                });
              } catch (e) {
                if (e.status === 404) {
                  return `team "${slug}" not found in the ` +
                    `${TEAM_ORG} org (or not visible to the bot token)`;
                }
                throw e;
              }

              try {
                await github.rest.teams.checkPermissionsForRepoInOrg({
                  org: TEAM_ORG,
                  team_slug: slug,
                  owner,
                  repo,
                });
                return null;
              } catch (e) {
                if (e.status === 404) {
                  return `team "${slug}" exists but has no access to ` +
                    `${owner}/${repo}`;
                }
                throw e;
              }
            }

            const problems = [];
            const validUsers = [];
            const validTeams = [];

            try {
              for (const [login, sources] of users) {
                const problem = await checkUser(login);
                if (problem) {
                  problems.push(
                    `${problem} (declared in: ${[...sources].join(', ')})`
                  );
                } else {
                  validUsers.push(login);
                }
              }

              for (const [slug, sources] of teams) {
                const problem = await checkTeam(slug);
                if (problem) {
                  problems.push(
                    `${problem} (declared in: ${[...sources].join(', ')})`
                  );
                } else {
                  validTeams.push(slug);
                }
              }
            } catch (error) {
              core.setFailed(
                `Owner validation failed unexpectedly: ${error.message}`
              );
              return;
            }

            // Request whoever is valid, so one typo doesn't block
            // everyone else.
            if (validUsers.length > 0 || validTeams.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number:
                    context.payload.pull_request.number,
                  reviewers: validUsers,
                  team_reviewers: validTeams,
                });
                console.log(
                  'Requested reviewers:',
                  validUsers,
                  validTeams
                );
              } catch (error) {
                core.setFailed(
                  `requestReviewers failed: ${error.message}`
                );
              }
            }

            // Report the ones that could not be requested
            if (problems.length > 0) {
              for (const problem of problems) {
                core.error(problem);
              }

              await core.summary
                .addHeading('Reviewers that could not be requested')
                .addList(problems)
                .write();

              core.setFailed(
                `${problems.length} owner(s) could not be requested.`
              );
            }
